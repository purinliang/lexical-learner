[project]
name = "lexical-learner"
version = "0.1.0"
description = "Generate English scenario vocabulary with Gemini"
requires-python = ">=3.12"
dependencies = ["langchain-google-genai>=4.4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: makes real external API calls"]
